PART
{
	// SARA - Satélite de Reentrada Atmosférica (IAE/DCTA)
	// Peça única representando a cápsula real: estrutura + eletrônica/comando.
	// Sem paraquedas e sem propulsores RCS nesta versão (a definir depois).
	module = Part
	name = BRA-SARA
	author = Cross Aerospace
	tags = SARA, Brazil, IAE, DCTA, Capsule, Probe, RO, RP-1

	category = Pods
	subcategory = 0

	RSSROConfig = true
	RP0conf = true

	// Custo base pra funcionar em RO puro (sem RP-1). O patch em TechTreeUnified.cfg
	// pode sobrescrever esses valores quando RP-1 estiver instalado.
	cost = 900
	entryCost = 4000

	// Massa real do SARA Suborbital I: 290 kg (0.29 t)
	mass = 0.29
	crashTolerance = 15
	maxTemp = 1073.15
	skinMaxTemp = 2400
	skinInternalConductionMult = 0.0012

	breakingForce = 50
	breakingTorque = 50

	MODEL
	{
		model = BrazilianEngines/Parts/Payloads/SARA
	}

	scale = 1
	rescaleFactor = 1
	attachRules = 1,1,1,1,0

	// ATENÇÃO: valores estimados a partir das dimensões reais (Ø 1.0 m x 1.8 m de altura),
	// assumindo pivô do modelo na base. Ajuste no VAB/node editor se os nodes não baterem
	// com a malha exportada do Blender.
	node_stack_bottom = 0.0, -0.9, 0.0, 0.0, -1.0, 0.0, 1
	node_stack_top = 0.0, 0.9, 0.0, 0.0, 1.0, 0.0, 1

	emissiveConstant = 0.8
	dragModelType = default
	maximum_drag = 0.3
	minimum_drag = 0.2
	angularDrag = 2

	title = SARA
	manufacturer = IAE - DCTA
	description = Satélite de Reentrada Atmosférica (SARA), desenvolvido pelo IAE/DCTA para experimentos em microgravidade. Dados do SARA Suborbital I: 1000 mm de diâmetro na base, 1800 mm de altura, massa de 290 kg, estrutura interna em fibra de carbono e coifa com proteção térmica para reentrada. Projetado para operar em órbita de 300 km, com capacidade de até 55 kg de carga científica e permanência orbital de até 10 dias antes da reentrada. Nesta versão a peça representa apenas a estrutura e a eletrônica de comando do satélite; sistemas de recuperação (paraquedas) e controle de atitude por gás frio ainda não foram implementados.

	CrewCapacity = 0

	MODULE
	{
		name = ModuleCommand
		minimumCrew = 0

		RESOURCE
		{
			name = ElectricCharge
			rate = 0.02
		}
	}

	MODULE
	{
		name = ModuleReactionWheel
		PitchTorque = 0.5
		YawTorque = 0.5
		RollTorque = 0.5

		RESOURCE
		{
			name = ElectricCharge
			rate = 0.15
		}
	}

	MODULE
	{
		name = ModuleDataTransmitter
		antennaType = INTERNAL
		packetInterval = 0.4
		packetSize = 2
		packetResourceCost = 12.0
		requiredResource = ElectricCharge
		antennaPower = 5000
		optimumRange = 2500
		packetFloor = 0.1
		packetCeiling = 5
	}

	MODULE
	{
		name = ModuleSAS
		SasEnabled = True
	}

	// Coifa com proteção térmica (dado real) representada como escudo ablativo
	// embutido na própria peça. Perfil LEO/suborbital (300 km), não lunar.
	MODULE
	{
		name = ModuleAblator
		ablativeResource = Ablator
		lossExp = -6000
		lossConst = 0.03
		pyrolysisLossFactor = 20000
		ablationTempThresh = 500
		reentryConductivity = 0.01
	}

	RESOURCE
	{
		name = Ablator
		amount = 60
		maxAmount = 60
	}

	RESOURCE
	{
		name = ElectricCharge
		amount = 100
		maxAmount = 100
	}

	// Pacote fixo de experimentos embutido (representa os ~55 kg reais de carga
	// científica: protótipo de GPS da UFRN + unidade de medidas inerciais do IAE).
	MODULE
	{
		name = ModuleScienceExperiment

		experimentID = BRA_SARA_Payload
		experimentActionName = Rodar experimentos do SARA
		resetActionName = Reiniciar experimentos do SARA
		reviewActionName = Ver dados do SARA

		useStaging = False
		useActionGroups = True
		hideUIwhenUnavailable = True
		rerunnable = False

		xmitDataScalar = 0.5
		dataIsCollectable = True
		collectActionName = Coletar dados do SARA
	}

	MODULE
	{
		name = ModuleScienceContainer

		reviewActionName = Ver dados armazenados
		storeActionName = Armazenar dados
		evaOnlyStorage = False
		storageRange = 2.0
		allowRepeatedSubjects = True
	}

	// TechRequired/cost/entryCost ficam no TechTreeUnified.cfg (mesmo padrão dos motores).
}

// Experimento customizado representando o pacote científico fixo do SARA.
EXPERIMENT_DEFINITION
{
	id = BRA_SARA_Payload
	title = Pacote de Experimentos SARA (GPS/IMU)
	baseValue = 12
	scienceCap = 24
	dataScale = 1.5
	requireAtmosphere = False
	situationMask = 60
	biomeMask = 0
}
