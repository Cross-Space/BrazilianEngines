// ForgottenRealEngines - RO/RP-1 tech tree classification
// v0.8: Cruzeiro do Sul / Vega integration pass.
// Nodes are conservative placeholders until checked in a live RP-1 career install.
// P40/P50 are Brazilian concept motors. P80/Zefiro/P120/P160/RD-843 are Avio/Vega references, not Brazilian engines.

// Cruzeiro do Sul conceptual solid motors
@PART[BRA-P40]:FOR[xxxRP0]
{
    %TechRequired = solids1992
    %cost = 450
    %entryCost = 18000
    RP0conf = true
    @description ^=:$: <b><color=green> ForgottenRealEngines: Cruzeiro do Sul concept, RO/RP-1 only.</color></b>
    MODULE { name = ModuleTagEngineSolid }
}
