PART
{
	module = Part
	name = BRA-Arion_Advanced
	author = Cross Aerospace

    RSSROConfig = true
	RP0conf = true

	ROESetEngineDefaults = LIQUID_ENGINE
	
	//	============================================================================
	//	Update Below
	//	============================================================================

	MODEL
	{
		model = ROEngines/Assets/BDB/Delta/bluedog_AJ10_118K
		scale = 1.0, 1.0, 1.0
	}

	scale = 1.0
	rescaleFactor = 0.4
	node_stack_top = 0.0, 0.55377, 0.0, 0.0, 1.0, 0.0, 0
	node_stack_bottom = 0.0, -1.0109, 0.0, 0.0, -1.0, 0.0, 0
	// stack, srfAttach, allowStack, allowSrfAttach, allowCollision
	attachRules = 1,1,1,0,0

	title = Arion Advanced (Advanced Long Nozzle)
	manufacturer = Bizu Space
	description = Motor líquido privado brasileiro em desenvolvimento associado à Bizu Space. O Arion-1 é um motor de propelentes líquidos bipropelentes, pressurizado, com ignição única, projetado para uso em foguetes suborbitais e orbitais. O motor utiliza HTP (peróxido de hidrogênio altamente concentrado) como oxidante e querosene como combustível. O projeto do Arion-1 é baseado em princípios de engenharia modernos, visando eficiência, confiabilidade e facilidade de integração em veículos lançadores.

	tags = arion, brasil, bizu, liquid, engine, rocket

	engineType = Arion-2

	//FX
	fx_exhaustFlame_blue_small = 0.0, -21.0, 0.0, 0.0, 1.0, 0.0, running
	fx_exhaustLight_blue = 0.0, -21.0, 0.0, 0.0, 0.0, 1.0, running
	fx_smokeTrail_light = 0.0, -21.0, 0.0, 0.0, 1.0, 0.0, running
	sound_vent_medium = engage
	sound_rocket_hard = running
	sound_vent_soft = disengage
	sound_explosion_low = flameout

	MODULE
	{
		name = ModuleEnginesRF
		thrustVectorTransformName = thrustTransform
	}
    MODULE
	{
		name = ModuleEngineConfigs
		type = ModuleEngines
		configuration = Arion-2
		modded = false
		origMass = 0.060

		CONFIG
		{
			name = Arion-2
			description = Configuração HTP/querosene do Arion-2.
			minThrust = 5.0
			maxThrust = 5.0
			heatProduction = 100
			ratedBurnTime = 100
			massMult = 1.0

			ullage = True
			pressureFed = False
			ignitions = 4

			PROPELLANT
			{
				name = Kerosene
				ratio = 0.1755
				DrawGauge = True
			}
			PROPELLANT
			{
				name = HTP
				ratio = 0.8245
			}
			atmosphereCurve
			{
				key = 0 290
				key = 1 260
			}
		}
	}

	MODULE
	{
		name = ModuleGimbal
		gimbalTransformName = gimbalTransform
	}

	MODULE
	{
		name = FXModuleLookAtConstraint

		CONSTRAINLOOKFX
		{
			targetName = gimbal1_Upper
			rotatorsName = gimbal1_Lower
		}
		CONSTRAINLOOKFX
		{
			targetName = gimbal1_Lower
			rotatorsName = gimbal1_Upper
		}
		CONSTRAINLOOKFX
		{
			targetName = gimbal2_Upper
			rotatorsName = gimbal2_Lower
		}
		CONSTRAINLOOKFX
		{
			targetName = gimbal2_Lower
			rotatorsName = gimbal2_Upper
		}
	}

	MODULE
	{
		name = FXModuleThrottleEffects
		fxModuleNames = heatColor
		responseSpeed = 1.0
		dependOnEngineState = True
		dependOnThrottle = True
	}
	MODULE
	{
		name = FXModuleThrottleEffects
		fxModuleNames = throttleColor
		responseSpeed = 1.0
		dependOnEngineState = True
		dependOnThrottle = True
	}
	MODULE
	{
		name = ModuleColorChanger
		moduleID = heatColor
		animRate = 0.025
		shaderProperty = _EmissiveColor
		excludedRenderer = innerGlow
		toggleInEditor = false
		toggleInFlight = false
		redCurve
		{
			key = 1 1 1 1
			key = 1 1 1 1
		}
		greenCurve
		{
			key = 0 0 1 1
			key = 1 1 1 1
		}
		blueCurve
		{
			key = 0 0 1 1
			key = 1 1 1 1
		}
		alphaCurve
		{
			key = 0 0 1 1
			key = 1 1 1 1
		}
	}
	MODULE
	{
		name = ModuleColorChanger
		moduleID = throttleColor
		animRate = 1
		shaderProperty = _TintColor
		includedRenderer = innerGlow
		toggleInEditor = false
		toggleInFlight = false
		redCurve
		{
			key = 0 0
			key = 1 1
		}
		greenCurve
		{
			key = 0 0
			key = 1 1
		}
		blueCurve
		{
			key = 0 0
			key = 1 1
		}
		alphaCurve
		{
			key = 0 0
			key = 1 1
		}
	}
}
