PART
{
	// RO/RP-1 strict resource audit v0.2: solid motors use RealFuels HTPB/PBAN-style resources, not stock solid propellant.
    module = Part
    name = BRA-N04
    author = Cross Aerospace
    tags = brazil, ML-BR

    RSSROConfig = true
	RP0conf = true

    breakingForce = 10000
	breakingTorque = 10000

    MODEL
    {
        model = ROEngines/Assets/BDB/Solids/UpperSolids/bluedog_UpperSolids_Star37BV
    }

    mesh = N04
    scale = 1.0
    rescaleFactor = 0.975
    node_stack_top = 0.0, 0.45752, 0.0, 0.0, 1.0, 0.0, 1
    node_stack_bottom = 0.0, -0.45752, 0.0, 0.0, -1.0, 0.0, 1
    // stack, srfAttach, allowStack, allowSrfAttach, allowCollision
    attachRules = 1,1,1,1,0

    skinInternalConductionMult = 4.0
	emissiveConstant = 0.8
	dragModelType = default
	maximum_drag = 0.2
	minimum_drag = 0.2
	angularDrag = 2
	crashTolerance = 20
	maxTemp = 1973.15
	category = Engine
	subcategory = 0
	stagingIcon = SOLID_BOOSTER

    title = Nauru 04
    manufacturer = CENIC
    description = 'WIP'

    MODULE
    {
        name = ModuleEnginesRF
        thrustVectorTransformName = thrustTransform
        allowShutdown = False
		throttleLocked = True
    }
	MODULE
	{
		name = ModuleEngineConfigs
		type = ModuleEngines
		configuration = N04
		modded = false
		origMass = 0.024
		CONFIG
		{
			name = N04
			maxThrust = 12
			heatProduction = 100
			ratedBurnTime = 85
			ignitions = 1
			pressureFed = False
			ullage = False
			minThrust = 12

            IGNITOR_RESOURCE
            {
                name = ElectricCharge
                amount = 0.1
            }
            PROPELLANT
            {
                name = HTPB
                ratio = 1.0
                DrawGauge = True
                resourceFlowMode = STACK_PRIORITY_SEARCH
            }
            atmosphereCurve
            {
                key = 0 260
                key = 1 250
            }
			curveResource = HTPB
			powerEffectName = Solid-Lower

            thrustCurve
            {
                key = 1.00 1.24
                key = 0.96 1.273
                key = 0.85 1.196
                key = 0.65 1.107
                key = 0.45 1.041
                key = 0.25 0.952
                key = 0.10 0.72
                key = 0.00 0.166
            }
		}
    }
    MODULE
    {
        name = ModuleFuelTanks
        volume = 224.7
        type = HTPB
        basemass = -1
        TANK
        {
            name = HTPB
            amount = 224.7
            maxAmount = 224.7
        }
    }
    MODULE
    {
        name = ModuleB9PartSwitch
        moduleID = meshSwitchTop
        switcherDescription = Top Adapter
        switcherDescriptionPlural = Top Adapters
        affectDragCubes = True
        affectFARVoxels = True
        SUBTYPE
        {
            name = Enabled
            transform = TopMesh
        }
        SUBTYPE
        {
            name = Disabled
            transform = NoMesh
        }
    }
    MODULE
    {
        name = ModuleB9DisableTransform
        transform = bottomFairing
    }
    MODULE
    {
        name = ModuleSurfaceFX
        thrustProviderModuleIndex = 0
        fxMax = 0.75
        maxDistance = 50
        falloff = 1.8
        thrustTransformName = thrustTransform
    }
    MODULE
    {
        name = FXModuleLookAtConstraint
        CONSTRAINLOOKFX
        {
            targetName = gimbal1Aim
            rotatorsName = gimbal1_Rotate
        }
        CONSTRAINLOOKFX
        {
            targetName = gimbal2Aim
            rotatorsName = gimbal2_Rotate
        }
    }
    MODULE
    {
        name = FXModuleAnimateThrottle
        animationName = Star37B_Heat_Emit
        responseSpeed = 0.1
        dependOnEngineState = True
        dependOnThrottle = True
    }
}
