PART
{
	module = Part
	name = BRA-Arion_Mid
	author = Cross Aerospace

    RSSROConfig = true
	RP0conf = true

	ROESetEngineDefaults = LIQUID_ENGINE

	//  ============================================================================
	//	Update Below
	//  ============================================================================

	MODEL
	{
		model = ROEngines/Assets/BDB/Able/bluedog_Ablestar_Engine
		rotation = 0, 0, 0 // Aligned like old model.
	}

	scale = 1.0
	rescaleFactor = 0.4
	node_stack_top = 0.0, 0.50375, 0.0, 0.0, 1.0, 0.0, 0
	node_stack_bottom = 0.0, -0.5685, 0.0, 0.0, -1.0, 0.0, 0
	// stack, srfAttach, allowStack, allowSrfAttach, allowCollision
	attachRules = 1,1,1,0,0

	title = Arion 1 (Mid)
	manufacturer = Bizu Space
	description = Motor líquido privado brasileiro em desenvolvimento associado à Bizu Space. O Arion-1 é um motor de propelentes líquidos bipropelentes, pressurizado, com ignição única, projetado para uso em foguetes suborbitais e orbitais. O motor utiliza HTP (peróxido de hidrogênio altamente concentrado) como oxidante e querosene como combustível. O projeto do Arion-1 é baseado em princípios de engenharia modernos, visando eficiência, confiabilidade e facilidade de integração em veículos lançadores.

	tags = Arion-1, Brazil, ML-BR, HTP, Kerosene, RealFuels, RO, RP-1

	engineType = Arion-1b

	//FX
	fx_exhaustFlame_blue_small = 0.0, -0.8, 0.0, 0.0, 1.0, 0.0, running
	fx_exhaustLight_blue = 0.0, -0.8, 0.0, 0.0, 0.0, 1.0, running
	fx_smokeTrail_light = 0.0, -1.3, 0.0, 0.0, 1.0, 0.0, running
	sound_vent_medium = engage
	sound_rocket_hard = running
	sound_vent_soft = disengage
	sound_explosion_low = flameout

	MODULE
	{
		name = ModuleEnginesRF
		thrustVectorTransformName = thrustTransform
	}
    MODULE
	{
		name = ModuleEngineConfigs
		type = ModuleEngines
		configuration = Arion-1b
		modded = false
		origMass = 0.052

		CONFIG
		{
			name = Arion-1b
			description = Configuração HTP/querosene do Arion-1.
			minThrust = 5.0
			maxThrust = 5.0
			heatProduction = 100
			ratedBurnTime = 100
			massMult = 1.0

			ullage = True
			pressureFed = True
			ignitions = 2

			PROPELLANT
			{
				name = Kerosene
				ratio = 0.1755
				DrawGauge = True
			}
			PROPELLANT
			{
				name = HTP
				ratio = 0.8245
			}
			atmosphereCurve
			{
				key = 0 270
				key = 1 230
			}
		}
	}
	EFFECTS
	{
		running
		{
			AUDIO
			{
				channel = Ship
				clip = sound_rocket_mini
				volume = 0.0 0.0
				volume = 1.0 0.5
				pitch = 0.0 0.5
				pitch = 1.0 1.0
				loop = true
			}
			MODEL_MULTI_PARTICLE
			{
				modelName = Squad/FX/Monoprop_big
				transformName = thrustTransform
				emission = 0.0 0.0
				emission = 0.4 0.8
				emission = 1.0 1.0
				speed = 0.0 0.8
				speed = 1.0 1.0
				//localOffset = 0, 0, 1
			}
		}
		engage
		{
			AUDIO
			{
				channel = Ship
				clip = sound_vent_soft
				volume = 1.0
				pitch = 2.0
				loop = false
			}
		}
		flameout
		{
			PREFAB_PARTICLE
			{
				prefabName = fx_exhaustSparks_flameout_2
				transformName = thrustTransform
				oneShot = true
			}
			AUDIO
			{
				channel = Ship
				clip = sound_explosion_low
				volume = 1.0
				pitch = 2.0
				loop = false
			}
		}
	}

	MODULE
	{
		name = ModuleGimbal
		gimbalTransformName = gimbalTransform
	}
	MODULE
	{
		name = ModuleSurfaceFX
		thrustProviderModuleIndex = 0
		fxMax = 0.5
		maxDistance = 30
		falloff = 1.7
		thrustTransformName = thrustTransform
	}
	MODULE
	{
		name = FXModuleLookAtConstraint

		CONSTRAINLOOKFX
		{
			targetName = gimbal1_Upper
			rotatorsName = gimbal1_Lower
		}
		CONSTRAINLOOKFX
		{
			targetName = gimbal1_Lower
			rotatorsName = gimbal1_Upper
		}
		CONSTRAINLOOKFX
		{
			targetName = gimbal2_Upper
			rotatorsName = gimbal2_Lower
		}
		CONSTRAINLOOKFX
		{
			targetName = gimbal2_Lower
			rotatorsName = gimbal2_Upper
		}
		CONSTRAINLOOKFX
		{
			targetName = gimbal3_Upper
			rotatorsName = gimbal3_Lower
		}
		CONSTRAINLOOKFX
		{
			targetName = gimbal3_Lower
			rotatorsName = gimbal3_Upper
		}
		CONSTRAINLOOKFX
		{
			targetName = gimbal4_Upper
			rotatorsName = gimbal4_Lower
		}
		CONSTRAINLOOKFX
		{
			targetName = gimbal4_Lower
			rotatorsName = gimbal4_Upper
		}
	}
	MODULE
	{
		name = FXModuleThrottleEffects
		fxModuleNames = heatColor
		responseSpeed = 1.0
		dependOnEngineState = True
		dependOnThrottle = True
	}
	MODULE
	{
		name = FXModuleThrottleEffects
		fxModuleNames = throttleColor
		responseSpeed = 1.0
		dependOnEngineState = True
		dependOnThrottle = True
	}
	MODULE
	{
		name = ModuleColorChanger
		moduleID = heatColor
		animRate = 0.025
		shaderProperty = _EmissiveColor
		excludedRenderer = innerGlow
		toggleInEditor = false
		toggleInFlight = false
		redCurve
		{
			key = 1 1 1 1
			key = 1 1 1 1
		}
		greenCurve
		{
			key = 0 0 1 1
			key = 1 1 1 1
		}
		blueCurve
		{
			key = 0 0 1 1
			key = 1 1 1 1
		}
		alphaCurve
		{
			key = 0 0 1 1
			key = 1 1 1 1
		}
	}
	MODULE
	{
		name = ModuleColorChanger
		moduleID = throttleColor
		animRate = 1
		shaderProperty = _TintColor
		includedRenderer = innerGlow
		toggleInEditor = false
		toggleInFlight = false
		redCurve
		{
			key = 0 0
			key = 1 1
		}
		greenCurve
		{
			key = 0 0
			key = 1 1
		}
		blueCurve
		{
			key = 0 0
			key = 1 1
		}
		alphaCurve
		{
			key = 0 0
			key = 1 1
		}
	}
}