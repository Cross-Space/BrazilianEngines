PART
{
	module = Part
	name = BRA-Arion
	author = Cross Aerospace
	tags = Arion-1, Brazil, ML-BR, HTP, Kerosene, RealFuels, RO, RP-1

	category = Engine
	subcategory = 0

	RSSROConfig = true
	RP0conf = true

	crashTolerance = 10
	maxTemp = 923.15
	skinTemp = 1023.15

	breakingForce = 10000
	breakingTorque = 10000

	MODEL
	{
		model = ROEngines/Assets/AdmiralKew/Veronique_AGI_
	}

	scale = 1
	rescaleFactor = 0.20
	attachRules = 1,1,1,0,0
	node_stack_top = 0.0, -0.05, 0.0, 0.0, 1.0, 0.0
	node_stack_bottom = 0.0, -2.28, 0.0, 0.0, -1.0, 0.0
	node_attach = 0.0, 0.05, 0.0, 0.0, 1.0, 0.0

	emissiveConstant = 0.8 // engine nozzles are good at radiating.
	dragModelType = default
	maximum_drag = 0.2
	minimum_drag = 0.2
	angularDrag = 2

	title = Arion-1
	manufacturer = Bizu Space
	description = Motor líquido privado brasileiro em desenvolvimento associado à Bizu Space. O Arion-1 é um motor de propelentes líquidos bipropelentes, pressurizado, com ignição única, projetado para uso em foguetes suborbitais e orbitais. O motor utiliza HTP (peróxido de hidrogênio altamente concentrado) como oxidante e querosene como combustível. O projeto do Arion-1 é baseado em princípios de engenharia modernos, visando eficiência, confiabilidade e facilidade de integração em veículos lançadores.

	engineType = Arion-1

	MODULE
	{
		name = ModuleEnginesRF
		thrustVectorTransformName = thrustTransform
	}
	MODULE
	{
		name = ModuleEngineConfigs
		type = ModuleEngines
		configuration = Arion-1
		modded = false
		origMass = 0.045

		CONFIG
		{
			name = Arion-1
			description = Configuração HTP/querosene do Arion-1.
			minThrust = 5.0
			maxThrust = 5.0
			heatProduction = 100
			ratedBurnTime = 100
			massMult = 1.0

			ullage = True
			pressureFed = True
			ignitions = 1

			PROPELLANT
			{
				name = Kerosene
				ratio = 0.1755
				DrawGauge = True
			}
			PROPELLANT
			{
				name = HTP
				ratio = 0.8245
			}
			atmosphereCurve
			{
				key = 0 240
				key = 1 220
			}
		}
	}
	MODULE
    {
        name = ModuleSurfaceFX
        thrustProviderModuleIndex = 0
        fxMax = 0.3
        maxDistance = 30
        falloff = 1.7
        thrustTransformName = thrustTransform
    }
	MODULE
    {
        name = FXModuleThrottleEffects
        fxModuleNames = throttleColor
        responseSpeed = 1.0
        dependOnEngineState = True
        dependOnThrottle = True
    }
    MODULE
    {
        name = ModuleColorChanger
        moduleID = throttleColor
        animRate = 1
        shaderProperty = _EmissiveColor
        toggleInEditor = false
        toggleInFlight = false
        redCurve
        {
            key = 0 0
            key = 1 0.75
        }
        greenCurve
        {
            key = 0 0
            key = 1 0.75
        }
        blueCurve
        {
            key = 0 0
            key = 1 0.75
        }
        alphaCurve
        {
            key = 0 0
            key = 1 0.75
        }
    }
}

KSP_MODEL_SHADER:NEEDS[TexturesUnlimited]
{
	name = Arion-1
	recolorable = false

	model = ROEngines/Assets/AdmiralKew/Veronique_AGI_

	MATERIAL
	{
        shader = TU/Metallic
        texture = _MainTex, ROEngines/Assets/AdmiralKew/AGI_MainTex
        texture = _BumpMap, ROEngines/Assets/AdmiralKew/AGI_BumpMap
        texture = _Emissive, ROEngines/Assets/AdmiralKew/AGI_Emission
		texture = _MetallicGlossMap, ROEngines/Assets/AdmiralKew/AGI_MetallicGlossMap
	}
}
