  en-us
  {
    // Brazilian Engines Mod - English Localization
    // v1.2.0 "Programa Sonda" Release
    
    // MOD IDENTIFICATION
    #autoLOC_BEng_ModName = Brazilian Engines
    #autoLOC_BEng_ModShortName = BrazilianEngines
    #autoLOC_BEng_ModDesc = A collection of Brazilian rocket engines for KSP RP-1
    
    // ============================================================================
    // S-SERIES SOLID MOTORS - IAE HISTORICAL DEVELOPMENT
    // ============================================================================
    
    // S10-1 Motor
    #autoLOC_BEng_S10_1_Name = S10-1 Solid Motor
    #autoLOC_BEng_S10_1_Desc = Early Brazilian solid motor, used for atmospheric research and initial propulsion experiments. Reliable but limited thrust output. Part of the early Brazilian aerospace heritage.
    #autoLOC_BEng_S10_1_Title = S10-1 Solid Rocket Motor
    
    // S10-2 Motor
    #autoLOC_BEng_S10_2_Name = S10-2 Solid Motor
    #autoLOC_BEng_S10_2_Desc = Improved variant of the S10-1, offering better performance and reliability. Used in early sub-orbital and low-orbit missions.
    #autoLOC_BEng_S10_2_Title = S10-2 Solid Rocket Motor
    
    // S20 Motor
    #autoLOC_BEng_S20_Name = S20 Solid Motor
    #autoLOC_BEng_S20_Desc = First generation larger solid motor developed by IAE (Instituto de Aeronáutica e Espaço). Significantly improved performance over S10 series. Foundation for Brazilian space program expansion.
    #autoLOC_BEng_S20_Title = S20 Solid Rocket Motor
    
    // S23 Motor
    #autoLOC_BEng_S23_Name = S23 Solid Motor
    #autoLOC_BEng_S23_Desc = Enhanced variant of S20 with improved burn characteristics. Higher specific impulse and better throttle control. Represents mid-1950s Brazilian rocket development.
    #autoLOC_BEng_S23_Title = S23 Solid Rocket Motor
    
    // S30 Motor
    #autoLOC_BEng_S30_Name = S30 Solid Motor
    #autoLOC_BEng_S30_Desc = Second generation solid motor with significantly increased thrust. Part of the VLS (Veículo Lançador de Satélites) program development. More capable than S20-series predecessors.
    #autoLOC_BEng_S30_Title = S30 Solid Rocket Motor
    
    // S31 Motor
    #autoLOC_BEng_S31_Name = S31 Solid Motor
    #autoLOC_BEng_S31_Desc = Improved S30 variant with optimized propellant grain and nozzle design. Provides better performance characteristics and reliability.
    #autoLOC_BEng_S31_Title = S31 Solid Rocket Motor
    
    // S33 Motor
    #autoLOC_BEng_S33_Name = S33 Solid Motor
    #autoLOC_BEng_S33_Desc = Multi-stage capable motor with improved burn rate stability. Used as booster stage in multi-motor configurations. Enhanced nozzle design for better vacuum performance.
    #autoLOC_BEng_S33_Title = S33 Solid Rocket Motor
    
    // S40 Motor
    #autoLOC_BEng_S40_Name = S40 Solid Motor
    #autoLOC_BEng_S40_Desc = Large solid motor designed for VLS-1 (Veículo Lançador de Satélites) first stage. Represents Brazilian heavy-lift capability. High thrust and long burn time.
    #autoLOC_BEng_S40_Title = S40 Solid Rocket Motor (VLS-1 First Stage)
    
    // S43 Motor
    #autoLOC_BEng_S43_Name = S43 Solid Motor
    #autoLOC_BEng_S43_Desc = Advanced VLS-1 solid motor used in both first and second stages. Improved performance through advanced propellant formulation and manufacturing techniques. One of Brazil's most successful rocket motors.
    #autoLOC_BEng_S43_Title = S43 Solid Rocket Motor (VLS-1 First/Second Stage)
    
    // S44 Motor
    #autoLOC_BEng_S44_Name = S44 Solid Motor
    #autoLOC_BEng_S44_Desc = Specialized high-altitude/vacuum optimized variant of S43 for upper stage applications. Longer nozzle and improved performance in low-pressure environment.
    #autoLOC_BEng_S44_Title = S44 Solid Rocket Motor (VLS-1 Upper Stage)
    
    // S50 Motor
    #autoLOC_BEng_S50_Name = S50 Solid Motor
    #autoLOC_BEng_S50_Desc = Modern large solid motor for next-generation launch vehicles. Significantly improved performance and reliability over S40 series. Part of future Brazilian heavy-lift initiatives.
    #autoLOC_BEng_S50_Title = S50 Solid Rocket Motor
    
    // ============================================================================
    // N-SERIES SOLID MOTORS - ML-BR PROGRAM (PROVISIONAL DATA)
    // ============================================================================
    
    // N04 Motor
    #autoLOC_BEng_N04_Name = N04 Solid Motor
    #autoLOC_BEng_N04_Desc = Small solid motor from the ML-BR (Míssil de Longo Alcance Brasileiro) program. Provisional data - exact specifications are government-restricted. Development phase motor.
    #autoLOC_BEng_N04_Title = N04 Solid Motor (ML-BR Program)
    
    // N09 Motor
    #autoLOC_BEng_N09_Name = N09 Solid Motor
    #autoLOC_BEng_N09_Desc = Mid-thrust motor from ML-BR program. Provisional data - specifications based on available historical references. Used in medium-range platform development.
    #autoLOC_BEng_N09_Title = N09 Solid Motor (ML-BR Program)
    
    // N90 Motor
    #autoLOC_BEng_N90_Name = N90 Solid Motor
    #autoLOC_BEng_N90_Desc = Large solid motor from ML-BR program. Provisional data - represents high-performance capability. Part of long-range platform development initiatives.
    #autoLOC_BEng_N90_Title = N90 Solid Motor (ML-BR Program)
    
    // ============================================================================
    // LIQUID MOTORS - IAE AND PRIVATE DEVELOPMENT
    // ============================================================================
    
    // Arion Series
    #autoLOC_BEng_Arion_Name = Arion Liquid Engine
    #autoLOC_BEng_Arion_Desc = Pressure-fed liquid rocket engine using HTP/Kerosene propellants. Developed for private/commercial Brazilian space initiatives. Compact design suitable for small satellites and suborbital missions.
    #autoLOC_BEng_Arion_Title = Arion Liquid Rocket Engine
    
    #autoLOC_BEng_Arion_Early_Name = Arion-Early Liquid Engine
    #autoLOC_BEng_Arion_Early_Desc = Early development variant of the Arion engine. Lower performance but proven reliability. Used in initial test programs.
    #autoLOC_BEng_Arion_Early_Title = Arion-Early Liquid Rocket Engine
    
    #autoLOC_BEng_Arion_Mid_Name = Arion-Mid Liquid Engine
    #autoLOC_BEng_Arion_Mid_Desc = Mid-development variant offering improved thrust and efficiency over Early variant. Balance between performance and development risk.
    #autoLOC_BEng_Arion_Mid_Title = Arion-Mid Liquid Rocket Engine
    
    #autoLOC_BEng_Arion_Advanced_Name = Arion-Advanced Liquid Engine
    #autoLOC_BEng_Arion_Advanced_Desc = Advanced high-performance variant of the Arion engine. Improved combustion chamber design and injector technology. Suitable for demanding mission profiles.
    #autoLOC_BEng_Arion_Advanced_Title = Arion-Advanced Liquid Rocket Engine
    
    // ============================================================================
    // FUTURE ENGINES (PLANNED)
    // ============================================================================
    
    #autoLOC_BEng_L5_Name = L5 Liquid Engine
    #autoLOC_BEng_L5_Desc = Small Brazilian ethanol/LOX liquid engine. In development. Planned for future releases.
    #autoLOC_BEng_L5_Title = L5 Liquid Rocket Engine (Planned)
    
    #autoLOC_BEng_L15_Name = L15 Liquid Engine
    #autoLOC_BEng_L15_Desc = Medium Brazilian liquid engine using ethanol/LOX propellants. In development. Planned for future releases.
    #autoLOC_BEng_L15_Title = L15 Liquid Rocket Engine (Planned)
    
    #autoLOC_BEng_L75_Name = L75 Liquid Engine
    #autoLOC_BEng_L75_Desc = Large Brazilian liquid engine for orbital-class vehicles. In development. Planned for future releases.
    #autoLOC_BEng_L75_Title = L75 Liquid Rocket Engine (Planned)
    
    // ============================================================================
    // GENERIC DESCRIPTIONS
    // ============================================================================
    
    #autoLOC_BEng_Solid_Motor = Solid Rocket Motor
    #autoLOC_BEng_Liquid_Engine = Liquid Rocket Engine
    #autoLOC_BEng_IAE_Origin = Developed by IAE (Instituto de Aeronáutica e Espaço)
    #autoLOC_BEng_Private_Origin = Private Brazilian aerospace development
    #autoLOC_BEng_RP1_Integration = Fully integrated for RP-1 tech tree
    #autoLOC_BEng_Tribute = Dedicated to the 21 Heroes of Alcântara
  }
}
