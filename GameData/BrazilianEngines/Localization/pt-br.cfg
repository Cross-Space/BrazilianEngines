Localization
{
  pt-br
  {
    // Brazilian Engines Mod - Localização em Português Brasileiro
    // Versão 1.2.0 "Programa Sonda"
    
    // IDENTIFICAÇÃO DO MOD
    #autoLOC_BEng_ModName = Motores Brasileiros
    #autoLOC_BEng_ModShortName = MotoresBrasileiros
    #autoLOC_BEng_ModDesc = Uma coleção de motores de foguete brasileiros para KSP RP-1
    
    // ============================================================================
    // MOTORES SÓLIDOS SÉRIE S - DESENVOLVIMENTO HISTÓRICO IAE
    // ============================================================================
    
    // Motor S10-1
    #autoLOC_BEng_S10_1_Name = Motor Sólido S10-1
    #autoLOC_BEng_S10_1_Desc = Motor sólido brasileiro primitivo, utilizado em pesquisa atmosférica e experimentos iniciais de propulsão. Confiável, mas com impulso limitado. Parte do patrimônio aeroespacial brasileiro inicial.
    #autoLOC_BEng_S10_1_Title = Motor de Foguete Sólido S10-1
    
    // Motor S10-2
    #autoLOC_BEng_S10_2_Name = Motor Sólido S10-2
    #autoLOC_BEng_S10_2_Desc = Variante melhorada do S10-1, oferecendo melhor desempenho e confiabilidade. Utilizado em missões suborbitais e de baixa órbita.
    #autoLOC_BEng_S10_2_Title = Motor de Foguete Sólido S10-2
    
    // Motor S20
    #autoLOC_BEng_S20_Name = Motor Sólido S20
    #autoLOC_BEng_S20_Desc = Primeiro motor sólido de grande porte desenvolvido pela IAE (Instituto de Aeronáutica e Espaço). Desempenho significativamente melhor que a série S10. Fundação para a expansão do programa espacial brasileiro.
    #autoLOC_BEng_S20_Title = Motor de Foguete Sólido S20
    
    // Motor S23
    #autoLOC_BEng_S23_Name = Motor Sólido S23
    #autoLOC_BEng_S23_Desc = Variante melhorada do S20 com características de queima aprimoradas. Impulso específico mais alto e melhor controle de impulso. Representa o desenvolvimento de foguetes brasileiros meados de 1950.
    #autoLOC_BEng_S23_Title = Motor de Foguete Sólido S23
    
    // Motor S30
    #autoLOC_BEng_S30_Name = Motor Sólido S30
    #autoLOC_BEng_S30_Desc = Motor sólido de segunda geração com impulso significativamente aumentado. Parte do desenvolvimento do programa VLS (Veículo Lançador de Satélites). Mais capaz que os antecessores da série S20.
    #autoLOC_BEng_S30_Title = Motor de Foguete Sólido S30
    
    // Motor S31
    #autoLOC_BEng_S31_Name = Motor Sólido S31
    #autoLOC_BEng_S31_Desc = Variante melhorada do S30 com desenho otimizado de grão de combustível e bocal. Fornece melhor desempenho e características de confiabilidade.
    #autoLOC_BEng_S31_Title = Motor de Foguete Sólido S31
    
    // Motor S33
    #autoLOC_BEng_S33_Name = Motor Sólido S33
    #autoLOC_BEng_S33_Desc = Motor capaz de múltiplos estágios com estabilidade de taxa de queima aprimorada. Utilizado como estágio propulsor em configurações multi-motor. Design de bocal aprimorado para melhor desempenho no vácuo.
    #autoLOC_BEng_S33_Title = Motor de Foguete Sólido S33
    
    // Motor S40
    #autoLOC_BEng_S40_Name = Motor Sólido S40
    #autoLOC_BEng_S40_Desc = Motor sólido grande projetado para o primeiro estágio do VLS-1 (Veículo Lançador de Satélites). Representa a capacidade brasileira de pesado. Alto impulso e tempo de queima prolongado.
    #autoLOC_BEng_S40_Title = Motor de Foguete Sólido S40 (Primeiro Estágio VLS-1)
    
    // Motor S43
    #autoLOC_BEng_S43_Name = Motor Sólido S43
    #autoLOC_BEng_S43_Desc = Motor sólido avançado do VLS-1 utilizado em primeiro e segundo estágios. Desempenho aprimorado através de formulação de combustível avançada e técnicas de fabricação. Um dos motores de foguete mais bem-sucedidos do Brasil.
    #autoLOC_BEng_S43_Title = Motor de Foguete Sólido S43 (Primeiro/Segundo Estágio VLS-1)
    
    // Motor S44
    #autoLOC_BEng_S44_Name = Motor Sólido S44
    #autoLOC_BEng_S44_Desc = Variante especializada otimizada para alta altitude/vácuo do S43 para aplicações de estágio superior. Bocal mais longo e desempenho aprimorado em ambiente de baixa pressão.
    #autoLOC_BEng_S44_Title = Motor de Foguete Sólido S44 (Estágio Superior VLS-1)
    
    // Motor S50
    #autoLOC_BEng_S50_Name = Motor Sólido S50
    #autoLOC_BEng_S50_Desc = Motor sólido grande moderno para veículos lançadores de próxima geração. Desempenho significativamente aprimorado e confiabilidade sobre série S40. Parte de iniciativas futuras brasileiras de pesado.
    #autoLOC_BEng_S50_Title = Motor de Foguete Sólido S50
    
    // ============================================================================
    // MOTORES SÓLIDOS SÉRIE N - PROGRAMA ML-BR (DADOS PROVISÓRIOS)
    // ============================================================================
    
    // Motor N04
    #autoLOC_BEng_N04_Name = Motor Sólido N04
    #autoLOC_BEng_N04_Desc = Motor sólido pequeno do programa ML-BR (Míssil de Longo Alcance Brasileiro). Dados provisórios - especificações exatas são restritas. Motor em fase de desenvolvimento.
    #autoLOC_BEng_N04_Title = Motor Sólido N04 (Programa ML-BR)
    
    // Motor N09
    #autoLOC_BEng_N09_Name = Motor Sólido N09
    #autoLOC_BEng_N09_Desc = Motor de impulso médio do programa ML-BR. Dados provisórios - especificações baseadas em referências históricas disponíveis. Utilizado em desenvolvimento de plataforma de médio alcance.
    #autoLOC_BEng_N09_Title = Motor Sólido N09 (Programa ML-BR)
    
    // Motor N90
    #autoLOC_BEng_N90_Name = Motor Sólido N90
    #autoLOC_BEng_N90_Desc = Motor sólido grande do programa ML-BR. Dados provisórios - representa capacidade de alto desempenho. Parte de iniciativas de desenvolvimento de plataforma de longo alcance.
    #autoLOC_BEng_N90_Title = Motor Sólido N90 (Programa ML-BR)
    
    // ============================================================================
    // MOTORES LÍQUIDOS - DESENVOLVIMENTO IAE E PRIVADO
    // ============================================================================
    
    // Série Arion
    #autoLOC_BEng_Arion_Name = Motor Líquido Arion
    #autoLOC_BEng_Arion_Desc = Motor de foguete líquido alimentado por pressão utilizando propelentes HTP/Querosene. Desenvolvido para iniciativas espaciais privadas/comerciais brasileiras. Design compacto adequado para satélites pequenos e missões suborbitais.
    #autoLOC_BEng_Arion_Title = Motor de Foguete Líquido Arion
    
    #autoLOC_BEng_Arion_Early_Name = Motor Líquido Arion-Inicial
    #autoLOC_BEng_Arion_Early_Desc = Variante em desenvolvimento inicial do motor Arion. Desempenho menor, mas confiabilidade comprovada. Utilizado em programas iniciais de teste.
    #autoLOC_BEng_Arion_Early_Title = Motor de Foguete Líquido Arion-Inicial
    
    #autoLOC_BEng_Arion_Mid_Name = Motor Líquido Arion-Intermediário
    #autoLOC_BEng_Arion_Mid_Desc = Variante em desenvolvimento intermediário oferecendo impulso e eficiência melhorados sobre variante Inicial. Equilíbrio entre desempenho e risco de desenvolvimento.
    #autoLOC_BEng_Arion_Mid_Title = Motor de Foguete Líquido Arion-Intermediário
    
    #autoLOC_BEng_Arion_Advanced_Name = Motor Líquido Arion-Avançado
    #autoLOC_BEng_Arion_Advanced_Desc = Variante de alto desempenho avançada do motor Arion. Câmara de combustão melhorada e tecnologia de injetor. Adequado para perfis de missão exigentes.
    #autoLOC_BEng_Arion_Advanced_Title = Motor de Foguete Líquido Arion-Avançado
    
    // ============================================================================
    // MOTORES FUTUROS (PLANEJADOS)
    // ============================================================================
    
    #autoLOC_BEng_L5_Name = Motor Líquido L5
    #autoLOC_BEng_L5_Desc = Motor líquido brasileiro pequeno etanol/LOX. Em desenvolvimento. Planejado para versões futuras.
    #autoLOC_BEng_L5_Title = Motor de Foguete Líquido L5 (Planejado)
    
    #autoLOC_BEng_L15_Name = Motor Líquido L15
    #autoLOC_BEng_L15_Desc = Motor líquido brasileiro médio utilizando propelentes etanol/LOX. Em desenvolvimento. Planejado para versões futuras.
    #autoLOC_BEng_L15_Title = Motor de Foguete Líquido L15 (Planejado)
    
    #autoLOC_BEng_L75_Name = Motor Líquido L75
    #autoLOC_BEng_L75_Desc = Motor líquido brasileiro grande para veículos de classe orbital. Em desenvolvimento. Planejado para versões futuras.
    #autoLOC_BEng_L75_Title = Motor de Foguete Líquido L75 (Planejado)
    
    // ============================================================================
    // DESCRIÇÕES GENÉRICAS
    // ============================================================================
    
    #autoLOC_BEng_Solid_Motor = Motor de Foguete Sólido
    #autoLOC_BEng_Liquid_Engine = Motor de Foguete Líquido
    #autoLOC_BEng_IAE_Origin = Desenvolvido pela IAE (Instituto de Aeronáutica e Espaço)
    #autoLOC_BEng_Private_Origin = Desenvolvimento aeroespacial privado brasileiro
    #autoLOC_BEng_RP1_Integration = Totalmente integrado com árvore tecnológica RP-1
    #autoLOC_BEng_Tribute = Dedicado aos 21 Heróis de Alcântara
  }
}
