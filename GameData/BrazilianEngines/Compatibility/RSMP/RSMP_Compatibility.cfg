// BrazilianEngines -> RSMP compatibility
// Optional: only active when RSMP and Waterfall are installed.
// Uses RSMP's existing SRB templates; BrazilianEngines does not redistribute RSMP assets here.
// Scope: BrazilianEngines SRB motors only. No changes to liquid engines or RSMP configs for other mods.

@PART[BRA-S20]:AFTER[ROWaterfall]:NEEDS[RSMP,Waterfall]
// IMPORTANT: runs after the native BrazilianEngines ROWaterfall has been processed.
{
    // Replace any BrazilianEngines Waterfall plume with the RSMP SRB plume stack.
    !MODULE[ModuleWaterfallFX],* {}

    MODULE
    {
        name = ModuleWaterfallFX
        moduleID = BrazilianEnginesRSMP_01

        CONTROLLER
        {
            name = atmosphereDepth
            linkedTo = atmosphere_density
        }
        CONTROLLER
        {
            name = throttle
            linkedTo = throttle
        }
        CONTROLLER
        {
            name = random
            linkedTo = random
            noiseType = perlin
            scale = 0.5
            minimum = -0.5
            speed = 10
            seed = 41
        }
        CONTROLLER
        {
            name = Burnout
            linkedTo = engineEvent
            eventName = flameout
            eventDuration = 600
            eventCurve
            {
                key = 0 0
                key = 0.1 1
                key = 600 0.2
            }
        }
		TEMPLATE
        {
			templateName = srb-waterfall
			overrideParentTransform = thrustTransform
			position = 0,0,-0.022
			rotation = 0, 0, 0
			scale = 0.112, 0.112, 0.112
		}
		TEMPLATE
		{
			templateName = lemon-SRB-core
			overrideParentTransform = thrustTransform
			position = 0,0,-0.036
			rotation = 0, 0, 0
			scale = 0.146, 0.146, 0.2
		}
    }
}
