// Brazilian Engines - Waterfall / ROWaterfall unified plume assignments
// Target environment: RSS + RO + RP-1 + RealFuels + Waterfall/ROWaterfall.
// Rule: plume template follows real propellant family, not stock gameplay category.
//   HTPB solids      -> SRM plume templates
//   Ethanol/LOX      -> kerolox/alcohol-compatible oxygenated hydrocarbon plume templates
//   Kerosene/LOX     -> kerolox plume templates
//   HTP/Kerosene     -> small pressure-fed hydrocarbon/oxidizer plume approximation

// -----------------------------------------------------------------------------
// Solid motors - IAE and ML-BR family
// -----------------------------------------------------------------------------

@PART[BRA-S20]:BEFORE[ROWaterfall]:NEEDS[Waterfall]
{
    ROWaterfall
    {
        template = rowaterfall-hybrid-srm-1
        useHybrid = true
        audio = srm-2
        position = 0,0,0
        rotation = 0,0,0
        scale = 0.30,0.30,0.60
    }
}

