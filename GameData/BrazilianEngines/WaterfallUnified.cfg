// -----------------------------------------------------------------------------
// Liquid motors - real Brazilian propellant families
// -----------------------------------------------------------------------------
// Visual rule v0.4:
//   Ethanol/LOX engines are assigned a clean, translucent hydrolox-style upper plume
//   because Waterfall has no dedicated ethanol/LOX template and kerolox templates are
//   deliberately reddish/brighter to represent sootier kerosene-family exhaust.
//   Kerosene/LOX engines keep kerolox templates.
//   HTP/Kerosene uses compact kerolox as the closest available pressure-fed visual.
// -----------------------------------------------------------------------------

// L5-E/EPL: Ethanol/LOX, pressure-fed, 5 kN class. Clean/translucent plume.
@PART[BRA-L5]:BEFORE[ROWaterfall]:NEEDS[Waterfall]
{
    ROWaterfall
    {
        template = waterfall-hydrolox-upper-1
        audio = pressure-fed-1
        position = 0,0,0.00
        rotation = 0,0,0
        scale = 0.10,0.10,0.15
    }
}

// L5-K: Kerosene/LOX technical-study variant. Denser kerolox plume.
@PART[BRA-L5K]:BEFORE[ROWaterfall]:NEEDS[Waterfall]
{
    ROWaterfall
    {
        template = waterfall-kerolox-upper-2
        audio = pressure-fed-1
        position = 0,0,0.00
        rotation = 0,0,0
        scale = 0.11,0.11,0.16
