// =============================================================================
// RealFuels.cfg - Restaura os módulos RealFuels/RP-1 originais quando o
// RealFuels está instalado. Sem esse mod presente, as peças rodam com a
// versão stock (ModuleEnginesFX + SolidFuel/LiquidFuel/Oxidizer) definida
// direto no PART base.
//
// IMPORTANTE: roda em :BEFORE[xxxRP0], garantindo que os módulos RF já
// estejam de volta antes dos patches de tech/custo do RP-1 (TechTreeUnified.cfg,
// ENTRYCOST.cfg, TESTFLIGHT.cfg) tentarem mexer neles.
// =============================================================================

@PART[BRA-N04]:NEEDS[RealFuels]:BEFORE[xxxRP0]
{
	!MODULE[ModuleEnginesFX] {}
	!RESOURCE[SolidFuel] {}

	MODULE

	{

		name = ModuleEnginesRF

		thrustVectorTransformName = thrustTransform

		allowShutdown = False

		throttleLocked = True

	}
	MODULE

	{

		name = ModuleEngineConfigs

		type = ModuleEngines

		configuration = N04

		modded = false

		origMass = 0.024

		CONFIG

		{

			name = N04

			maxThrust = 12

			heatProduction = 100

			ratedBurnTime = 85

			ignitions = 1

			pressureFed = False

			ullage = False

			minThrust = 12



			IGNITOR_RESOURCE

			{

				name = ElectricCharge

				amount = 0.1

			}

			PROPELLANT

			{

				name = HTPB

				ratio = 1.0

				DrawGauge = True

				resourceFlowMode = STACK_PRIORITY_SEARCH

			}

			atmosphereCurve

			{

				key = 0 260

				key = 1 250

			}

			curveResource = HTPB

			powerEffectName = Solid-Lower



			thrustCurve

			{

				key = 1.00 1.24

				key = 0.96 1.273

				key = 0.85 1.196

				key = 0.65 1.107

				key = 0.45 1.041

				key = 0.25 0.952

				key = 0.10 0.72

				key = 0.00 0.166

			}

		}

	}
	MODULE

	{

		name = ModuleFuelTanks

		volume = 224.72

		type = HTPB

		basemass = -1

		TANK

		{

			name = HTPB

			amount = 224.72

			maxAmount = 224.72

		}

	}
}


